name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  build:
    name: Build, Test & Sanity Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall app scripts

      - name: Import sanity check
        env:
          # app/main.py は import 時に create_app() を実行するため、この確認には
          # 起動に必要な設定が一式要る。いずれも CI 用のダミー値。
          #
          # SESSION_SECRET: Web 面が必須で要求する。
          # SERVER_ROLE:    既定値を持たない。未設定を「両方」に落とすと、本番の env が
          #                 1 つ欠けただけで公開 web に /tasks/* が復活するため。
          # ALLOWED_TASK_SERVICE_ACCOUNTS: both は worker 面を含み、許可リストが空だと
          #                 verify_task_caller が全拒否になる（fail-closed）ため起動時に落ちる。
          SESSION_SECRET: "ci-dummy-session-secret"
          SERVER_ROLE: "both"
          ALLOWED_TASK_SERVICE_ACCOUNTS: "ci-dummy@example.iam.gserviceaccount.com"
        run: python -c "import app.main"

      - name: Run tests
        env:
          SESSION_SECRET: "ci-dummy-session-secret"
        run: python -m pytest -q

  vulncheck:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt
