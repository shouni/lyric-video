name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  build:
    name: Build, Test & Sanity Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall app

      - name: Import sanity check
        env:
          # app/main.py runs create_app() at import time, so this check needs the
          # full set of settings required for startup. All of them are dummy values for CI.
          #
          # SESSION_SECRET: The web face requires it.
          # SERVER_ROLE:    It has no default. If unset fell back to "both", a single
          #                 missing env in production would bring /tasks/* back on the public web.
          # ALLOWED_TASK_SERVICE_ACCOUNTS: both includes the worker face, and with an empty allowlist
          #                 verify_task_caller rejects everyone (fail-closed), so startup fails.
          SESSION_SECRET: "ci-dummy-session-secret"
          SERVER_ROLE: "both"
          ALLOWED_TASK_SERVICE_ACCOUNTS: "ci-dummy@example.iam.gserviceaccount.com"
        run: python -c "import app.main"

      - name: Run tests
        env:
          SESSION_SECRET: "ci-dummy-session-secret"
        run: python -m pytest -q

  vulncheck:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt
