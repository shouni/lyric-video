substitutions:
  _ENV_PREFIX: 'develop'
  _REGION: 'asia-northeast1'
  _IMAGE_BASE: 'asia-northeast1-docker.pkg.dev'
  _REPO_PATH: 'ap-repo/lyric-video'
  _WEB_SERVICE_NAME: 'lyric-video'
  _WORKER_SERVICE_NAME: 'lyric-video-worker'
  _TAG: '${_ENV_PREFIX}-${SHORT_SHA}'
  _WHISPER_MODEL: 'large-v3'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Setup Buildx'
    args: ['buildx', 'create', '--driver', 'docker-container', '--name', 'builder', '--use']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Worker Image'
    args:
      - 'buildx'
      - 'build'
      - '--target'
      - 'worker'
      - '-t'
      - '${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:${_TAG}-worker'
      - '--cache-from'
      - 'type=registry,ref=${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:buildcache-worker'
      - '--build-arg'
      - 'WHISPER_MODEL=${_WHISPER_MODEL}'
      - '--cache-to'
      - 'type=registry,ref=${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:buildcache-worker,mode=max'
      - '--push'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Web Image'
    args:
      - 'buildx'
      - 'build'
      - '--target'
      - 'web'
      - '-t'
      - '${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:${_TAG}-web'
      - '--cache-from'
      - 'type=registry,ref=${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:buildcache-web'
      - '--cache-to'
      - 'type=registry,ref=${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:buildcache-web,mode=max'
      - '--push'
      - '.'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy Worker to Cloud Run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_WORKER_SERVICE_NAME}'
      - '--image=${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:${_TAG}-worker'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--execution-environment=gen2'
      - '--no-allow-unauthenticated'
      - '--timeout=1800'
      - '--memory=16Gi'
      - '--cpu=4'
      - '--concurrency=1'
      - '--update-env-vars'
      - 'GCP_PROJECT_ID=${PROJECT_ID},GCP_LOCATION_ID=${_REGION},WHISPER_MODEL=${_WHISPER_MODEL},SERVER_ROLE=worker,SERVICE_URL=https://${_WEB_SERVICE_NAME}-${PROJECT_NUMBER}.${_REGION}.run.app,TASK_AUDIENCE_URL=https://${_WORKER_SERVICE_NAME}-${PROJECT_NUMBER}.${_REGION}.run.app'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy Web to Cloud Run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_WEB_SERVICE_NAME}'
      - '--image=${_IMAGE_BASE}/${PROJECT_ID}/${_REPO_PATH}:${_TAG}-web'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--execution-environment=gen2'
      - '--allow-unauthenticated'
      - '--timeout=300'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--concurrency=20'
      - '--update-env-vars'
      - 'GCP_PROJECT_ID=${PROJECT_ID},GCP_LOCATION_ID=${_REGION},WHISPER_MODEL=${_WHISPER_MODEL},SERVER_ROLE=web,WORKER_URL=https://${_WORKER_SERVICE_NAME}-${PROJECT_NUMBER}.${_REGION}.run.app/tasks/generate,TASK_AUDIENCE_URL=https://${_WORKER_SERVICE_NAME}-${PROJECT_NUMBER}.${_REGION}.run.app'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
